version: 1

target:
  base_url: http://127.0.0.1:8080
  allowed_hosts: [127.0.0.1, localhost]

scenarios:
  - name: charge-once
    kind: idempotency
    # Reset the local mock so every run starts from zero effects. Only point
    # setup at endpoints you own in a disposable test environment.
    setup:
      - method: POST
        path: /_test/reset
    request:
      method: POST
      path: /orders
      headers:
        Idempotency-Key: test-order-001
      json: {customer_id: demo, amount: 100}
    repeat: 2
    assert:
      status: 200
      business_effect_count: 1
