name: Documentation improvement
description: Something in the docs is wrong, unclear or missing.
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Page or section
      description: A link to the file and heading, e.g. docs/webhooks.md#state-assertions.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Incorrect (the docs disagree with what FlowGuard does)
        - A command or example does not work
        - Unclear or hard to follow
        - Missing information
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is wrong or missing. For a failing command, include the command, its output and `flowguard version`.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      description: Optional. How you would fix it.
